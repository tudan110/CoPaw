[project]
name = "log-hazard-detection-scripts"
version = "0.1.0"
description = "Nightingale log hazard detection (Drain3 clustering + drift)"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "drain3>=0.9.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
