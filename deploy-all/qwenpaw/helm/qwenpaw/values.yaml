# 镜像
image:
  repository: qwenpaw
  tag: latest
  pullPolicy: IfNotPresent

# 副本数
replicaCount: 1

# 容器安全上下文
securityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
  fsGroup: 0

# 环境变量
env:
  timezone: "Asia/Shanghai"
  QWENPAW_PORT: "8088"
  QWENPAW_APP_WORKERS: "2"
  QWENPAW_APP_BACKLOG: "2048"
  QWENPAW_APP_TIMEOUT_KEEP_ALIVE: "5"
  QWENPAW_DISABLED_CHANNELS: "imessage"
  # QWENPAW_ENABLED_CHANNELS: ""
  # NB: 安全姿态（skill_scanner 模式、domain_guard、delete_ops_disabled、
  # tool_guard auto_denied_rules）放在工作目录的 config.json -> "security" 段，
  # 随 PVC / 镜像内的 working 目录走，换部署方式不会丢。这里不要再固定
  # QWENPAW_*_MODE / QWENPAW_DELETE_OPS_DISABLED —— 它们只是应急覆盖开关。

# 资源限制
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

# 服务端口
service:
  name: qwenpaw
  type: NodePort
  port: 8088
  targetPort: 8088
  nodePort: 30088

# 持久化存储
persistence:
  enabled: true
  # existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  # 工作目录挂载
  workingDir:
    enabled: true
    mountPath: /app/working
    subPath: working
  # 密钥目录挂载
  secretDir:
    enabled: true
    mountPath: /app/working.secret
    subPath: secret
