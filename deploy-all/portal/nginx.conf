worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/xml+rss;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Knowledge-base uploads (PDF/scans/spreadsheets) go through
        # /portal-api/; without this they hit nginx's 1MB default and fail with
        # "413 Request Entity Too Large". Set at the server level so every
        # location inherits it (/copaw-api/ keeps its own 100M cap below).
        client_max_body_size 200M;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location /copaw-api/ {
            proxy_pass http://qwenpaw:8088/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            # Skill .zip bundle uploads (POST /api/skills/pool/upload-zip);
            # backend caps the payload at 100MB.
            client_max_body_size 100M;
        }

        location /portal-api/ {
            proxy_pass http://qwenpaw:8088/api/portal/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        # Hashed bundle output — safe to cache forever.
        # Vite emits content-hashed filenames under /assets/, so any change
        # produces a new URL and the old one can be discarded.
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            try_files $uri =404;
        }

        # Other static binaries (favicon, etc.) — cache long but not immutable,
        # since their URLs are not hashed.
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
        }

        # Runtime config is rewritten by docker-entrypoint on every container
        # start and must never be cached, otherwise old tabs read stale config.
        location = /runtime-config.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires 0;
        }

        # SPA shell — must revalidate every load. Without this, browsers
        # heuristically cache index.html and keep pointing at chunk hashes
        # that no longer exist after a deploy, producing the classic
        # "white screen until I clear cache" symptom.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires 0;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location ~ /\. {
            deny all;
        }
    }
}
