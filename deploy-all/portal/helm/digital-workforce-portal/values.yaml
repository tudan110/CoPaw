# 镜像
image:
  repository: digital-workforce-portal
  tag: 0.1.0
  pullPolicy: IfNotPresent

# 副本数
replicaCount: 1

# 容器安全上下文
securityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
  fsGroup: 0

# 环境变量
env:
  timezone: "Asia/Shanghai"
  PORTAL_APP_TITLE: "数字员工门户"

# 资源限制
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# 服务端口
service:
  type: NodePort
  port: 80
  targetPort: 80
  nodePort: 30083

# 就绪探针：探 nginx 自身静态 /health（不经过上游）。
# nginx 进程一起来就 ready，前端静态页面始终可服务，不被后端抖动牵连下线。
readinessProbe:
  httpGet:
    path: /health
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# 存活探针：探 /healthz（真正经过反代打到 qwenpaw /api/portal/health）。
# 整机重启后 nginx worker 卡死在上游、反代全部超时但静态页仍 200 时，
# 这条会持续失败 → 自动重启 pod 自愈。
# 阈值刻意放宽（约 6×15=90s 持续失败才重启），避免后端短暂抖动误杀；
# 代价是后端若持续 >90s 不可达，portal 会周期性重启——这种已是需人工
# 介入的 P0，且重启不会让反代不通的状况更糟，属可接受取舍。
livenessProbe:
  httpGet:
    path: /healthz
    port: 80
  initialDelaySeconds: 20
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 6
