# ===========================================
# CNOS Inoe Agent 总配置
# ===========================================

# ----- digital-workforce-portal 配置 -----
digital-workforce-portal:
  # 固定服务名
  fullnameOverride: "digital-workforce-portal"

  # 镜像
  image:
    repository: digital-workforce-portal
    tag: 0.1.0
    pullPolicy: IfNotPresent

  # 副本数
  replicaCount: 1

  # 容器安全上下文
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0

  # 环境变量
  env:
    timezone: "Asia/Shanghai"
    FAULT_DISPOSAL_COPAW_BASE_URL: "http://qwenpaw:8088/api"

    # ----- SSO 单点登录（运行时注入 portal 的 runtime-config.js）-----
    # 改这里 → helm upgrade 让 pod 重启即生效，无需重构 portal 镜像。
    # 开关：默认 false；同 host 部署联调就绪后置 "true" 开启。
    PORTAL_SSO_ENABLED: "false"
    # INOE 前端 NodePort（自动拼登录 URL 用），默认 30081；仅当 NodePort 改了才设。
    # PORTAL_SSO_INOE_PORT: "30081"
    # 登录页完整地址覆盖，默认自动拼 http://<当前host>:<上面端口>/login。
    # 仅当 portal/INOE 不同 host 或登录路径不同才配；格式须 http://ip:port/login（不以 / 结尾）。
    # PORTAL_SSO_LOGIN_URL: ""

  # 资源限制
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # 服务端口
  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30083

# ----- qwenpaw 配置 -----
qwenpaw:
  # 固定服务名（nginx 通过此名称访问）
  fullnameOverride: "qwenpaw"

  # 镜像
  image:
    repository: qwenpaw
    tag: latest
    pullPolicy: IfNotPresent

  # 副本数
  replicaCount: 1

  # 容器安全上下文
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0

  # 环境变量
  env:
    timezone: "Asia/Shanghai"
    QWENPAW_PORT: "8088"
    QWENPAW_APP_WORKERS: "2"
    QWENPAW_APP_BACKLOG: "2048"
    QWENPAW_APP_TIMEOUT_KEEP_ALIVE: "5"
    QWENPAW_DISABLED_CHANNELS: "imessage"

    # 知识库检索（与 dev start-qwenpaw.sh 保持一致）
    # KNOWLEDGE_BASE_RERANKER: llm（QwenPaw active model）/ heuristic / none
    KNOWLEDGE_BASE_RERANKER: "llm"
    KNOWLEDGE_BASE_HYDE_ENABLED: "true"
    KNOWLEDGE_BASE_TOP_K: "3"
    KNOWLEDGE_BASE_LLM_RERANK_INPUT_K: "15"

    # 智观告警平台接口
    INOE_API_BASE_URL: "http://gateway:8080"
    INOE_API_TOKEN: "eyJhbGciOiJIUzUxMiJ9.eyJ1c2VyX2lkIjoxLCJ1c2VyX2tleSI6ImU5ZGIyMTljLTRiNmUtNGJkNS1hYmViLWExOWEyOTQ2YzQzYSIsInVzZXJuYW1lIjoieGlhb2sifQ.EpCFu6WKBPmirfqZHkBR-qPy72p9rZ8WgIPXFuDAJzg4KhH8ou88G7NvbfjwF9BN-hnRdCeh9mKJfbeuCVMetA"
    INOE_API_TIMEOUT: "60"

    # Portal 告警相关配置：均走「设置页 > 代码默认」解析，不在此注入。
    # 需要部署期覆盖时，参见 diagnosis_settings_store 的 FieldSpec
    # （QWENPAW_PORTAL_REAL_ALARM_* / QWENPAW_RECOVERY_*）。

    # ----- 大模型 OpenAI 风格适配层（模板，默认不注入）-----
    # 启明/星辰的网关与凭证默认走「设置页 > 代码默认」解析，不在此明文注入。
    # 需要在部署期声明式配置时，取消下面对应行的注释并填值；
    # 密钥（app_key / bearer_token / order_num / authorization）建议用 Secret
    # 注入，勿在 values 中明文提交。
    #
    # 启明：
    # QWENPAW_QIMING_BASE_URL: "http://<host>:<port>"
    # QWENPAW_QIMING_COMPLETIONS_PATH: "/serviceAgent/rest/wsc/completions"
    # QWENPAW_QIMING_APP_ID: "<app_id>"
    # QWENPAW_QIMING_APP_KEY: "<app_key>"
    # QWENPAW_QIMING_BEARER_TOKEN: "<bearer_token>"
    # QWENPAW_QIMING_MODELS: "qiming25_72b_fc"
    #
    # 星辰：
    # QWENPAW_XINGCHEN_BASE_URL: "https://<host>:<port>"
    # QWENPAW_XINGCHEN_CHAT_PATH: "/aipaas/lm/v1/telechat/chat115b"
    # QWENPAW_XINGCHEN_APP_ID: "<app_id>"
    # QWENPAW_XINGCHEN_ORDER_NUM: "<order_num>"
    # QWENPAW_XINGCHEN_AUTHORIZATION: "<authorization>"
    # QWENPAW_XINGCHEN_MODELS: "telechat-115b"

  # 资源限制
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

  # 服务端口
  service:
    type: NodePort
    port: 8088
    targetPort: 8088
    nodePort: 30088

  # 持久化存储
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    workingDir:
      enabled: true
      mountPath: /app/working
      subPath: working
    secretDir:
      enabled: true
      mountPath: /app/working.secret
      subPath: secret
