# ===========================================
# CNOS Inoe Agent 总配置
# ===========================================

# ----- digital-workforce-portal 配置 -----
digital-workforce-portal:
  # 固定服务名
  fullnameOverride: "digital-workforce-portal"

  # 镜像
  image:
    repository: digital-workforce-portal
    tag: 0.1.0
    pullPolicy: IfNotPresent

  # 副本数
  replicaCount: 1

  # 容器安全上下文
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0

  # 环境变量
  env:
    timezone: "Asia/Shanghai"
    FAULT_DISPOSAL_COPAW_BASE_URL: "http://qwenpaw:8088/api"

  # 资源限制
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # 服务端口
  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30073

# ----- qwenpaw 配置 -----
qwenpaw:
  # 固定服务名（nginx 通过此名称访问）
  fullnameOverride: "qwenpaw"

  # 镜像
  image:
    repository: qwenpaw
    tag: latest
    pullPolicy: IfNotPresent

  # 副本数
  replicaCount: 1

  # 容器安全上下文
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0

  # 环境变量
  env:
    timezone: "Asia/Shanghai"
    QWENPAW_PORT: "8088"
    QWENPAW_DISABLED_CHANNELS: "imessage"

    # 知识库检索（与 dev start-qwenpaw.sh 保持一致）
    # KNOWLEDGE_BASE_RERANKER: llm（QwenPaw active model）/ heuristic / none
    KNOWLEDGE_BASE_RERANKER: "llm"
    KNOWLEDGE_BASE_HYDE_ENABLED: "true"
    KNOWLEDGE_BASE_TOP_K: "3"
    KNOWLEDGE_BASE_LLM_RERANK_INPUT_K: "15"

    # 智观告警平台接口
    INOE_API_BASE_URL: "http://192.168.130.51:30080"
    INOE_API_TOKEN: "eyJhbGciOiJIUzUxMiJ9.eyJ1c2VyX2lkIjoxLCJ1c2VyX2tleSI6ImU5ZGIyMTljLTRiNmUtNGJkNS1hYmViLWExOWEyOTQ2YzQzYSIsInVzZXJuYW1lIjoieGlhb2sifQ.EpCFu6WKBPmirfqZHkBR-qPy72p9rZ8WgIPXFuDAJzg4KhH8ou88G7NvbfjwF9BN-hnRdCeh9mKJfbeuCVMetA"
    INOE_API_TIMEOUT: "60"

    # Portal 告警相关配置
    QWENPAW_PORTAL_REAL_ALARM_ROUTE_TIMEOUT: "5"
    QWENPAW_PORTAL_REAL_ALARM_CACHE_TTL: "30"
    QWENPAW_PORTAL_REAL_ALARM_DEGRADED_COOLDOWN: "30"
    QWENPAW_PORTAL_REAL_ALARM_AUTO_TAKEOVER_ENABLED: "true"
    QWENPAW_PORTAL_REAL_ALARM_AUTO_TAKEOVER_INTERVAL: "300"
    QWENPAW_PORTAL_REAL_ALARM_AUTO_TAKEOVER_LIMIT: "20"
    QWENPAW_PORTAL_REAL_ALARM_MAX_ACTIVE_ANALYSES: "1"

  # 资源限制
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

  # 服务端口
  service:
    type: NodePort
    port: 8088
    targetPort: 8088
    nodePort: 30088

  # 持久化存储
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    workingDir:
      enabled: true
      mountPath: /app/working
      subPath: working
    secretDir:
      enabled: true
      mountPath: /app/working.secret
      subPath: secret
