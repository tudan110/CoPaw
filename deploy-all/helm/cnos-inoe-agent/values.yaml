# ===========================================
# CNOS Inoe Agent 总配置
# ===========================================

# ----- digital-workforce-portal 配置 -----
digital-workforce-portal:
  # 固定服务名
  fullnameOverride: "digital-workforce-portal"

  # 镜像
  image:
    repository: digital-workforce-portal
    tag: 0.1.0
    pullPolicy: IfNotPresent

  # 副本数
  replicaCount: 1

  # 容器安全上下文
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0

  # 环境变量
  env:
    timezone: "Asia/Shanghai"
    FAULT_DISPOSAL_COPAW_BASE_URL: "http://qwenpaw:8088/api"

  # 资源限制
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  # 服务端口
  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30083

# ----- qwenpaw 配置 -----
qwenpaw:
  # 固定服务名（nginx 通过此名称访问）
  fullnameOverride: "qwenpaw"

  # 镜像
  image:
    repository: qwenpaw
    tag: latest
    pullPolicy: IfNotPresent

  # 副本数
  replicaCount: 1

  # 容器安全上下文
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0

  # 环境变量
  env:
    timezone: "Asia/Shanghai"
    QWENPAW_PORT: "8088"
    QWENPAW_DISABLED_CHANNELS: "imessage"

    # 知识库检索（与 dev start-qwenpaw.sh 保持一致）
    # KNOWLEDGE_BASE_RERANKER: llm（QwenPaw active model）/ heuristic / none
    KNOWLEDGE_BASE_RERANKER: "llm"
    KNOWLEDGE_BASE_HYDE_ENABLED: "true"
    KNOWLEDGE_BASE_TOP_K: "3"
    KNOWLEDGE_BASE_LLM_RERANK_INPUT_K: "15"

    # 启明大模型 OpenAI 风格适配层（测试时请使用本地覆盖文件或 Secret 注入真实密钥）
    QWENPAW_QIMING_BASE_URL: "http://10.130.154.233:30000"
    QWENPAW_QIMING_COMPLETIONS_PATH: "/serviceAgent/rest/wsc/completions"
    QWENPAW_QIMING_APP_ID: "0a2d65e4b7a76f9ab1c7190033139a49"
    QWENPAW_QIMING_APP_KEY: "d2c22dc2fc0cd2e87af202659f2667d5"
    QWENPAW_QIMING_BEARER_TOKEN: "gpustack_01458892ad42fc78_b6c9a74b9184402112ed477fa6ee7130"
    QWENPAW_QIMING_MODELS: "qiming25_72b_fc"

  # 资源限制
  resources:
    requests:
      cpu: 2000m
      memory: 4Gi
    limits:
      cpu: 4000m
      memory: 8Gi

  # 服务端口
  service:
    type: NodePort
    port: 8088
    targetPort: 8088
    nodePort: 30088

  # 持久化存储
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    workingDir:
      enabled: true
      mountPath: /app/working
      subPath: working
    secretDir:
      enabled: true
      mountPath: /app/working.secret
      subPath: secret
