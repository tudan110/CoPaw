# ===========================================
# CNOS Inoe Agent 总配置
# ===========================================

# ----- digital-workforce-portal 配置 -----
digital-workforce-portal:
  # 固定服务名
  fullnameOverride: "digital-workforce-portal"

  # 镜像
  image:
    repository: digital-workforce-portal
    tag: 0.1.0
    pullPolicy: IfNotPresent

  # 副本数
  replicaCount: 1

  # 容器安全上下文
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0

  # 环境变量
  env:
    timezone: "Asia/Shanghai"
    FAULT_DISPOSAL_COPAW_BASE_URL: "http://qwenpaw:8088/api"

  # 资源限制
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # 服务端口
  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30083

# ----- qwenpaw 配置 -----
qwenpaw:
  # 固定服务名（nginx 通过此名称访问）
  fullnameOverride: "qwenpaw"

  # 镜像
  image:
    repository: qwenpaw
    tag: latest
    pullPolicy: IfNotPresent

  # 副本数
  replicaCount: 1

  # 容器安全上下文
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0

  # 环境变量
  env:
    timezone: "Asia/Shanghai"
    QWENPAW_PORT: "8088"
    QWENPAW_APP_WORKERS: "2"
    QWENPAW_APP_BACKLOG: "2048"
    QWENPAW_APP_TIMEOUT_KEEP_ALIVE: "5"
    QWENPAW_DISABLED_CHANNELS: "imessage"

    # 知识库检索（与 dev start-qwenpaw.sh 保持一致）
    # KNOWLEDGE_BASE_RERANKER: llm（QwenPaw active model）/ heuristic / none
    KNOWLEDGE_BASE_RERANKER: "llm"
    KNOWLEDGE_BASE_HYDE_ENABLED: "true"
    KNOWLEDGE_BASE_TOP_K: "3"
    KNOWLEDGE_BASE_LLM_RERANK_INPUT_K: "15"

    # 智观告警平台接口
    INOE_API_BASE_URL: "http://10.3.39.246:30080"
    INOE_API_TOKEN: "eyJhbGciOiJIUzUxMiJ9.eyJ1c2VyX2lkIjoxLCJ1c2VyX2tleSI6ImU5ZGIyMTljLTRiNmUtNGJkNS1hYmViLWExOWEyOTQ2YzQzYSIsInVzZXJuYW1lIjoieGlhb2sifQ.EpCFu6WKBPmirfqZHkBR-qPy72p9rZ8WgIPXFuDAJzg4KhH8ou88G7NvbfjwF9BN-hnRdCeh9mKJfbeuCVMetA"
    INOE_API_TIMEOUT: "60"

    # Portal 告警相关配置
    QWENPAW_PORTAL_REAL_ALARM_ROUTE_TIMEOUT: "5"
    QWENPAW_PORTAL_REAL_ALARM_CACHE_TTL: "30"
    QWENPAW_PORTAL_REAL_ALARM_DEGRADED_COOLDOWN: "30"
    QWENPAW_PORTAL_REAL_ALARM_AUTO_TAKEOVER_ENABLED: "true"
    QWENPAW_PORTAL_REAL_ALARM_AUTO_TAKEOVER_INTERVAL: "300"
    QWENPAW_PORTAL_REAL_ALARM_AUTO_TAKEOVER_LIMIT: "100"
    QWENPAW_PORTAL_REAL_ALARM_MAX_ACTIVE_ANALYSES: "1"
    # 实时分析回溯（小时）：0=仅分析开启实时分析后新产生的告警；
    # N=起点前推 N 小时。页面「设置-诊断」配置优先。
    QWENPAW_PORTAL_REAL_ALARM_LOOKBACK_HOURS: "0"
    # 告警平台接口时区偏移（小时），默认东八区
    QWENPAW_PORTAL_REAL_ALARM_TIMEZONE_OFFSET: "8"
    # 前台告警列表与角标计数的最大条数（1-200），页面「设置-诊断」配置优先
    QWENPAW_PORTAL_REAL_ALARM_LIST_LIMIT: "20"


    # 启明大模型 OpenAI 风格适配层（测试时请使用本地覆盖文件或 Secret 注入真实密钥）
    QWENPAW_QIMING_BASE_URL: "http://10.130.154.233:30000"
    QWENPAW_QIMING_COMPLETIONS_PATH: "/serviceAgent/rest/wsc/completions"
    QWENPAW_QIMING_APP_ID: "your_qiming_app_id"
    QWENPAW_QIMING_APP_KEY: "your_qiming_app_key"
    QWENPAW_QIMING_BEARER_TOKEN: "your_qiming_bearer_token"
    QWENPAW_QIMING_MODELS: "qiming25_72b_fc"

    # 星辰大模型 OpenAI 风格适配层（测试时请使用本地覆盖文件或 Secret 注入真实密钥）
    QWENPAW_XINGCHEN_BASE_URL: "https://openapi.teleagi.cn:443"
    QWENPAW_XINGCHEN_CHAT_PATH: "/aipaas/lm/v1/telechat/chat115b"
    QWENPAW_XINGCHEN_APP_ID: "your_xingchen_app_id"
    QWENPAW_XINGCHEN_ORDER_NUM: "your_xingchen_order_num"
    QWENPAW_XINGCHEN_AUTHORIZATION: "your_xingchen_authorization"
    QWENPAW_XINGCHEN_MODELS: "telechat-115b"

  # 资源限制
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

  # 服务端口
  service:
    type: NodePort
    port: 8088
    targetPort: 8088
    nodePort: 30088

  # 持久化存储
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    workingDir:
      enabled: true
      mountPath: /app/working
      subPath: working
    secretDir:
      enabled: true
      mountPath: /app/working.secret
      subPath: secret
