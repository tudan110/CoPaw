# 领域关键词词库（可由运维管理员编辑）
#   positive   : 网管/网络运维强相关词 —— 命中越多越倾向"相关"
#   negative   : 其它专业方向的强信号词 —— 命中越多越倾向"不相关"
#   borderline : 通用工具词 —— 命中后会提示 LLM 仔细判断是否声明了网管场景
# 这只是给 LLM 的"先验信号"，最终判定仍由 LLM 主审 + 置信度分档决定。

